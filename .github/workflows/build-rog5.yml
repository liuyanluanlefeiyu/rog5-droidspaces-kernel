name: Build ROG5 DroidSpaces kernel

# Two kernels per run:
#   - full-fixed: DroidSpaces options + KABI patches, with RELR / STACKPROTECTOR_PER_TASK
#                 / TOOLS_SUPPORT_RELR / BUILD_ARM64_DT_OVERLAY disabled (stock-binary match)
#   - baseline  : pristine tree, no patches, no extra options (bisect reference)
# Both pin UTS_RELEASE to 5.4.210-qgki-perf so stock modules keep loading.

on:
  workflow_dispatch:
    inputs:
      build_full:
        description: 'Build full-fixed kernel'
        default: true
        type: boolean
      build_baseline:
        description: 'Build baseline kernel'
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_kind: full-fixed
            artifact: rog5-fullfixed
            enabled: ${{ inputs.build_full }}
          - kernel_kind: baseline
            artifact: rog5-baseline
            enabled: ${{ inputs.build_baseline }}
    name: kernel (${{ matrix.kernel_kind }})
    if: ${{ matrix.enabled }}
    steps:
      - name: Checkout this package
        uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio kmod zip zstd python3 \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone ROG5 kernel (lineage-20 = 5.4.210-qgki-perf, QSSI13.0)
        run: |
          git clone --depth=1 -b lineage-20 \
            https://github.com/alfaonyt/android_kernel_asus_sm8350 kernel

      - name: Apply DroidSpaces KABI patches (full-fixed only)
        if: matrix.kernel_kind == 'full-fixed'
        working-directory: kernel
        run: |
          git apply --check -v "$GITHUB_WORKSPACE/0001-rog5-sysvipc-kabi.patch"
          git apply        "$GITHUB_WORKSPACE/0001-rog5-sysvipc-kabi.patch"
          git apply --check -v "$GITHUB_WORKSPACE/0002-rog5-posix-mqueue-kabi.patch"
          git apply        "$GITHUB_WORKSPACE/0002-rog5-posix-mqueue-kabi.patch"
          echo '=== patch land verification ==='
          grep -n 'ANDROID_KABI_USE(6' include/linux/sched.h
          grep -n 'ANDROID_KABI_USE(1' include/linux/sched/user.h
          git config user.email ci@local
          git config user.name ci
          git commit -am 'apply DroidSpaces KABI patches'
          echo '=== tree status (should be empty) ==='
          git status --porcelain

      - name: Configure
        working-directory: kernel
        env:
          KCFLAGS: -D__ANDROID_COMMON_KERNEL__
        run: |
          export PATH="/usr/lib/llvm-14/bin:$PATH"
          touch .scmversion
          make O=../out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- DISABLE_WRAPPER=1 vendor/anakin_defconfig

          if [ "${{ matrix.kernel_kind }}" = "full-fixed" ]; then
            ./scripts/config --file ../out/.config \
              -e SYSVIPC             -e SYSVIPC_SYSCTL        -e POSIX_MQUEUE \
              -e POSIX_MQUEUE_SYSCTL -e NAMESPACES            -e UTS_NS \
              -e IPC_NS              -e USER_NS               -e PID_NS \
              -e NET_NS              -e DEVTMPFS              -e DEVTMPFS_MOUNT \
              -e CGROUP_DEVICE       -e CGROUP_PIDS           -e CFS_BANDWIDTH \
              -e MEMCG               -e TMPFS_XATTR           -e TMPFS_POSIX_ACL \
              -e OVERLAY_FS          -e VETH                  -e BRIDGE \
              -e BRIDGE_NETFILTER    -e NETFILTER_ADVANCED \
              -e NETFILTER_XT_MATCH_ADDRTYPE \
              -e NETFILTER_XT_TARGET_REJECT \
              -e NETFILTER_XT_TARGET_LOG \
              -e NETFILTER_XT_MATCH_RECENT \
              -e NETFILTER_XT_MATCH_COMMENT \
              -e IP_NF_NAT           -e IP_NF_TARGET_MASQUERADE \
              -e IP_SET              -e IP_SET_HASH_IP        -e IP_SET_HASH_NET \
              -e NETFILTER_XT_SET    -e CGROUPS
            echo '=== full-fixed: container options enabled ==='
          else
            echo '=== baseline: pristine config, no modifications ==='
          fi

          # Binary/ABI level options that the stock (AOSP clang-11 r383902b) kernel does NOT have.
          # Newer toolchains auto-enable them; forced off in BOTH variants for stock-like image.
          ./scripts/config --file ../out/.config \
            -d RELR -d TOOLS_SUPPORT_RELR \
            -d STACKPROTECTOR_PER_TASK \
            -d BUILD_ARM64_DT_OVERLAY \
            -d IKHEADERS -d UAPI_HEADER_TEST -d LOCALVERSION_AUTO

          make O=../out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- DISABLE_WRAPPER=1 olddefconfig

          echo '=== verify forced-off options (expect all "is not set" or absent) ==='
          grep -E 'CONFIG_RELR|TOOLS_SUPPORT_RELR|STACKPROTECTOR_PER_TASK|BUILD_ARM64_DT_OVERLAY' ../out/.config || echo '  none enabled - good'

          if [ "${{ matrix.kernel_kind }}" = "full-fixed" ]; then
            echo '=== required container options check ==='
            fail=0
            for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS USER_NS NET_NS \
                     DEVTMPFS CGROUP_DEVICE CGROUP_PIDS TMPFS_XATTR; do
              if grep -q "^CONFIG_${c}=y" ../out/.config; then
                echo "  [OK]   CONFIG_${c}=y"
              else
                echo "  [MISS] CONFIG_${c}"; fail=1
              fi
            done
            [ $fail -eq 0 ] || { echo 'missing required options, abort'; exit 1; }
          fi

      - name: Build kernel Image
        working-directory: kernel
        env:
          KCFLAGS: -D__ANDROID_COMMON_KERNEL__
        run: |
          export PATH="/usr/lib/llvm-14/bin:$PATH"
          make -j"$(nproc)" O=../out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- DISABLE_WRAPPER=1 Image.gz

      - name: Prepare artifacts (raw Image + gz + config)
        working-directory: kernel
        run: |
          ls -lh ../out/arch/arm64/boot/Image.gz
          cp ../out/arch/arm64/boot/Image.gz ../out/Image.gz
          gzip -dc ../out/arch/arm64/boot/Image.gz > ../out/Image
          cp ../out/.config ../out/kernel.config
          ver=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' ../out/include/generated/utsrelease.h)
          echo "UTS_RELEASE = $ver"
          if [ "$ver" != "5.4.210-qgki-perf" ]; then
            echo 'vermagic mismatch! abort'; exit 1
          fi
          echo 'vermagic exact match with stock'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/Image.gz
            out/Image
            out/kernel.config
          if-no-files-found: error
          include-hidden-files: true